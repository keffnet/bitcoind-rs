[package]
name = "bitcoind-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A high-performance Bitcoin node and Electrum-compatible indexer written in Rust"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bincode = "1.3"
bip324 = { version = "0.11", features = ["tokio"] }
bitcoin = { version = "0.32.7", features = ["serde"] }
bitcoinconsensus = "0.106.0"
bytes = "1.10"
capnp = "0.27"
capnp-rpc = "0.27"
chacha20 = "0.9"
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
futures = "0.3"
hex = "0.4"
libc = "0.2"
num-bigint = "0.4"
num-traits = "0.2"
miniscript = "13.1"
parking_lot = "0.12"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
sha3 = "0.10"
socket2 = "0.6"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1.44", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zstd = "0.13"
zeromq = "0.6"

[patch.crates-io]
# Core performs the exact 16-byte v1 preface check before handing a peer to
# the BIP324 state machine. The upstream crate rejects any key sharing only
# the four-byte network magic, which can be a valid v2 ElligatorSwift key.
bip324 = { path = "vendor/bip324" }

[dev-dependencies]
tempfile = "3.19"

[build-dependencies]
capnpc = "0.27"
capnpc-embedded = "0.2"

[[bin]]
name = "bitcoind-rs"
path = "src/main.rs"

[[bin]]
name = "bitcoin-cli"
path = "src/bitcoin_cli.rs"

[[bin]]
name = "bitcoin"
path = "src/bitcoin.rs"

[[bin]]
name = "bitcoin-util"
path = "src/bitcoin_util.rs"
